name: live-research-acceptance
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/live_research_mode_smoke.py"
      - ".github/workflows/live-acceptance.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-live-acceptance
  cancel-in-progress: false
jobs:
  public-research-smoke:
    name: Read-only public research deployment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify deployed public-data research mode
        run: python scripts/live_research_mode_smoke.py --base https://genomeguard.onrender.com --retries 20 --retry-delay 15 --timeout 25
